name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      VERSION: 0.1.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DeviceHaven.slnx

      - name: Build
        run: dotnet build DeviceHaven.slnx --configuration Release --no-restore -p:Version=${{ env.VERSION }}

      - name: Test
        run: dotnet test DeviceHaven.slnx --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Publish server (win-x64, self-contained)
        run: >
          dotnet publish src/DeviceHaven.Server/DeviceHaven.Server.csproj
          --configuration Release --runtime win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ env.VERSION }}
          --output out/server

      - name: Publish agent (win-x64, self-contained)
        run: >
          dotnet publish src/DeviceHaven.Agent/DeviceHaven.Agent.csproj
          --configuration Release --runtime win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ env.VERSION }}
          --output out/agent

      - name: Build installers (MSI)
        run: |
          dotnet build installer/Server/DeviceHaven.Server.Installer.wixproj --configuration Release -p:Version=${{ env.VERSION }} -p:ServerPublishDir="${{ github.workspace }}\out\server" --output out/msi
          dotnet build installer/Agent/DeviceHaven.Agent.Installer.wixproj --configuration Release -p:Version=${{ env.VERSION }} -p:AgentPublishDir="${{ github.workspace }}\out\agent" --output out/msi

      - name: Check the MSIs
        shell: pwsh
        run: |
          foreach ($msi in Get-ChildItem out/msi/*.msi) {
            $installer = New-Object -ComObject WindowsInstaller.Installer
            $db = $installer.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $installer, @($msi.FullName, 0))
            $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @("SELECT Value FROM Property WHERE Property='ProductVersion'"))
            $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null) | Out-Null
            $record = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
            $version = $record.GetType().InvokeMember('StringData', 'GetProperty', $null, $record, 1)
            "{0}  {1:N1} MB  version {2}" -f $msi.Name, ($msi.Length / 1MB), $version
          }

      - name: Install test (silent server + agent install, enrol, uninstall)
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Resolve-Path out/msi).Path
          New-Item -ItemType Directory -Force out/logs | Out-Null
          $logs = (Resolve-Path out/logs).Path

          function Install([string]$msiArgs) {
            $p = Start-Process msiexec.exe -ArgumentList $msiArgs -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "msiexec $msiArgs failed with exit code $($p.ExitCode)" }
          }

          # 1. Server, silent
          Install "/i `"$msi\DeviceHaven-Server.msi`" /qn /l*v `"$logs\server-install.log`""
          if ((Get-Service DeviceHavenServer).Status -ne 'Running') { throw 'Server service is not running' }

          # The server trusts its own certificate on this machine, so no -SkipCertificateCheck is needed.
          $ok = $false
          foreach ($i in 1..30) {
            try { Invoke-RestMethod https://localhost:8443/api/health | Out-Null; $ok = $true; break } catch { Start-Sleep 2 }
          }
          if (-not $ok) { throw 'Console did not answer on https://localhost:8443 with a trusted certificate' }
          "Server is up with a trusted certificate"

          # 2. Code from the admin API, as the console does
          $code = Invoke-RestMethod -Method Post https://localhost:8443/api/admin/enrollment-codes -ContentType 'application/json' -Body '{"validHours":1,"maxUses":1}'

          # 3. Agent, silent, with properties
          Install "/i `"$msi\DeviceHaven-Agent.msi`" /qn SERVERURL=`"https://localhost:8443`" FINGERPRINT=`"$($code.fingerprint)`" ENROLLCODE=`"$($code.code)`" /l*v `"$logs\agent-install.log`""
          if ((Get-Service DeviceHavenAgent).Status -ne 'Running') { throw 'Agent service is not running' }

          $leaks = Select-String -Path "$logs\agent-install.log" -SimpleMatch $code.code
          if ($leaks) {
            $leaks | ForEach-Object { "LEAK line $($_.LineNumber): " + $_.Line.Replace($code.code, '[CODE]') }
            throw 'Enrolment code was written to the install log'
          }
          "Enrolment code is not in the install log"

          # 4. Wait for the device and its inventory
          $device = $null
          foreach ($i in 1..45) {
            $devices = @(Invoke-RestMethod https://localhost:8443/api/admin/devices)
            if ($devices.Count -ge 1) {
              $detail = Invoke-RestMethod "https://localhost:8443/api/admin/devices/$($devices[0].id)"
              if ($detail.inventory) { $device = $detail; break }
            }
            Start-Sleep 2
          }
          if (-not $device) { throw 'Agent did not enrol and report inventory' }
          "Enrolled: {0} | {1} {2} | {3} programs | model {4}" -f $device.device.hostname, $device.inventory.osName, $device.inventory.osBuild, $device.inventory.apps.Count, $device.inventory.model

          if ((Get-ItemProperty 'HKLM:\SOFTWARE\DeviceHaven\Agent').Configured -ne 1) { throw 'Agent was not marked configured' }
          $cfg = Get-Content "$env:ProgramData\DeviceHaven\Agent\agent.json" -Raw | ConvertFrom-Json
          if ($cfg.enrollmentCode) { throw 'Enrolment code was kept after enrolling' }
          "Agent marked configured; enrolment code deleted after use"

          $acl = (Get-Acl "$env:ProgramData\DeviceHaven\Agent").Access | ForEach-Object { $_.IdentityReference.Value }
          if ($acl | Where-Object { $_ -match 'Users' }) { throw "Agent data folder is readable by users: $acl" }
          "Agent data folder locked to: $($acl -join ', ')"

          $proc = Get-Process -Name DeviceHaven.Agent
          "Agent memory: {0:N0} MB working set" -f ($proc.WorkingSet64 / 1MB)

          # 5. Uninstall both, silently
          Install "/x `"$msi\DeviceHaven-Agent.msi`" /qn /l*v `"$logs\agent-uninstall.log`""
          Install "/x `"$msi\DeviceHaven-Server.msi`" /qn /l*v `"$logs\server-uninstall.log`""
          if (Get-Service DeviceHavenAgent -ErrorAction SilentlyContinue) { throw 'Agent service still present after uninstall' }
          if (Get-Service DeviceHavenServer -ErrorAction SilentlyContinue) { throw 'Server service still present after uninstall' }
          "Both uninstalled cleanly"

      - name: Upload install logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-logs
          path: out/logs

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: DeviceHaven-Installers-${{ env.VERSION }}
          path: out/msi/*.msi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
